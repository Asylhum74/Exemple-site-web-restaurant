<body>

<header class="header-menu">
    <div class="header-home-content">
        <img src="./image/Logo.png" alt="logo" class="logo">
        <div class="center-content">
            <h1>Restaurant Le Délice</h1>
            <nav>
                <a href="./index.html">Accueil</a>
                <a href="./menu.html">Menu</a>
                <a href="./contact.html">Contact</a>
            </nav>
        </div>
    </div>
</header>

<section class="contact-section">
    <p>Adresse : 123 Rue de la Gastronomie, Paris</p>
    <p>Téléphone : 01 23 45 67 89</p>

    <form>
        <input type="text" placeholder="Nom">
        <input type="email" placeholder="Email">
        <textarea placeholder="Votre message"></textarea>
        <button type="submit">Envoyer</button>
    </form>
</section>

<!-- Footer -->
<footer class="footer">

        <div class="footer-item">
            <i class="fa-solid fa-location-dot"></i>
            <span>12 Rue des Saveurs, 75000 Paris</span>
        </div>

        <div class="footer-item">
            <i class="fa-solid fa-phone"></i>
            <span>01 23 45 67 89</span>
        </div>

        <div class="footer-item">
            <i class="fa-solid fa-clock"></i>
            <span>Lun-Ven 12h-14h / 19h-22h</span>
        </div>

        <div class="footer-socials">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        </div>

    </div>

    <div class="footer-bottom">
        <span>© 2026 Restaurant Le Délice</span>
        <div>
            <a href="#">Mentions légales</a>
            <a href="#">Confidentialité</a>
